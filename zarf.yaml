# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/e62a47c31c2a10854bd3f9d64f31345dffa26c68/src/pkg/schema/zarf-v1beta1-package-schema.json
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: #TEMPLATE_APPLICATION_NAME#
  description: "UDS #TEMPLATE_APPLICATION_DISPLAY_NAME# package"
  version: "0.0.0-dev"
  annotations:
    dev.uds.title: #TEMPLATE_APPLICATION_DISPLAY_NAME#

attachments:
  configuration: docs/configuration.md
  justifications: docs/justifications.md

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

components:
  - name: #TEMPLATE_APPLICATION_NAME#
    description: "Deploy #TEMPLATE_APPLICATION_DISPLAY_NAME#"
    import:
      local:
        - path: common/zarf.yaml
    selector:
      flavor: upstream
    charts:
      - name: #TEMPLATE_APPLICATION_NAME#
        valuesFiles:
          - path: values/upstream-values.yaml
    images: []
