includes:
  - test: ./tasks/test.yaml
  - create: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/create.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/lint.yaml
  - pull: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/pull.yaml
  - deploy: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/deploy.yaml
  - setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/setup.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/actions.yaml
  - upgrade: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/upgrade.yaml
  - publish: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.34.1/tasks/publish.yaml

variables:
  - name: NEXT_MODE
    default: "true"

tasks:
  - name: default
    description: Setup k3d cluster, deploy package
    actions:
      - task: create-dev-package
      - task: setup:k3d-test-cluster
      - task: create-deploy-test-bundle

  - name: create-dev-package
    description: Create the package
    actions:
      - task: create:package
        with:
          options: "--skip-sbom"

  - name: create-deploy-test-bundle
    description: Test and validate cluster is deployed with the package
    actions:
      - task: create:test-bundle
      - task: deploy:test-bundle
      - task: setup:keycloak-user
      - task: test:all

  - name: dev
    description: Create and deploy the bundle on an existing cluster (for iteration/dev speed)
    actions:
      - task: create-dev-package
      - task: create:test-bundle
      - task: deploy:test-bundle

#### Template CI: Remove this block and both CI task calls when building a package ####
  - name: ci-setup
    description: Populate template with podinfo values for CI validation
    actions:
      - cmd: |
          set -e

          APP_NAME="podinfo"
          DISPLAY_NAME="Podinfo"
          CHART_URL="oci://ghcr.io/stefanprodan/charts/podinfo"
          CHART_VERSION="6.7.1"
          APP_IMAGE="ghcr.io/stefanprodan/podinfo:6.7.1"
          APP_PORT="9898"
          COPYRIGHT_YEAR="$(date -u +%Y)"

          # Replace template placeholders across files
          find . -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.hcl" -o -name "*.ts" -o -name "*.json" -o -name "*.md" \) \
            -not -path "./.git/*" -not -path "*/node_modules/*" -print0 | \
            xargs -0 perl -pi -e "
              s/#TEMPLATE_COPYRIGHT_YEAR#/${COPYRIGHT_YEAR}/g;
              s/#TEMPLATE_APPLICATION_NAME#/${APP_NAME}/g;
              s/#TEMPLATE_APPLICATION_DISPLAY_NAME#/${DISPLAY_NAME}/g;
              s/#TEMPLATE_APPLICATION_PORT#/${APP_PORT}/g;
              s|#TEMPLATE_CHART_REPO#|${CHART_URL}|g;
              s|#UDS_PACKAGE_REPO#|https://github.com/stefanprodan/podinfo|g;
            "

          # Pin the upstream OCI chart and image to the same Podinfo release.
          CHART_URL="$CHART_URL" CHART_VERSION="$CHART_VERSION" ./zarf tools yq -i '
            del(.component.charts[1].git) |
            .component.charts[1].oci = {"url": strenv(CHART_URL), "ref": {"tag": strenv(CHART_VERSION)}} |
            .component.charts[1].values[0].excludePaths |= (. + [".podinfo.redis", ".podinfo.serviceAccount.imagePullSecrets"] | unique)
          ' common/zarf.yaml
          APP_IMAGE="$APP_IMAGE" ./zarf tools yq -i '
            (.components[] | select(.selector.flavor == "upstream")).images = [{"name": strenv(APP_IMAGE)}]
            | .metadata.annotations."dev.uds.tagline" = "Demo application for testing Kubernetes deployments."
            | .metadata.annotations."dev.uds.categories" = "Development, Testing"
            | .metadata.annotations."dev.uds.keywords" = "Kubernetes, Demo, Podinfo"
          ' zarf.yaml

          # Podinfo uses Authservice and a dedicated metrics port.
          perl -i -0pe 's|(  # Customize network policies and expose services via istio)|  sso:\n    - name: Podinfo Login\n      clientId: uds-demo-podinfo\n      redirectUris:\n        - "https://podinfo.uds.dev/login"\n      enableAuthserviceSelector:\n        app.kubernetes.io/name: podinfo\n  monitor:\n    - kind: PodMonitor\n      description: podinfo-metrics\n      selector:\n        app.kubernetes.io/name: podinfo\n      targetPort: 9797\n      portName: http-metrics\n$1|' chart/templates/uds-package.yaml
          perl -pi -e 's/^          app: podinfo$/          app.kubernetes.io\/name: podinfo/' chart/templates/uds-package.yaml

          # Podinfo has no application dependency that needs namespace-wide traffic.
          perl -i -0pe 's~    allow:\n.*?      \{\{ toYaml \. \| nindent 6 \}\}\n      \{\{- end \}\}~    {{- with .Values.additionalNetworkAllow }}\n    allow:\n      {{ toYaml . | nindent 6 }}\n    {{- end }}~s' chart/templates/uds-package.yaml

          # Run with the image’s non-root identity and deny privilege escalation.
          ./zarf tools yq -i '
            .securityContext = {
              "runAsNonRoot": true,
              "runAsUser": 100,
              "runAsGroup": 101,
              "allowPrivilegeEscalation": false,
              "capabilities": {"drop": ["ALL"]},
              "seccompProfile": {"type": "RuntimeDefault"}
            }
          ' values/common-values.yaml

          # Point auth.setup.ts at the root path (Authservice intercepts all routes)
          perl -pi -e 's|/example/endpoint|/|g' tests/auth.setup.ts

          # Rename template test file
          mv tests/template-application-name.test.ts "tests/${APP_NAME}.test.ts"
          perl -pi -e 's@page.goto\(\x27/\x27\)@page.goto("/version")@; s@  expect\(response\?\.status\(\)\)\.toBeLessThan\(400\);@  expect(response?.status()).toBe(200);\n  expect(await response?.text()).toContain("6.7.1");@; s/homepage loads/Podinfo returns its packaged version/' "tests/${APP_NAME}.test.ts"

          cat > docs/justifications.md <<'EOF'
          # Podinfo integration decisions

          Podinfo has no native OIDC integration, so the Package resource protects the
          tenant route through UDS Core Authservice. The package uses Ambient mode and
          declares no policy exemptions. Podinfo has no external service dependency in
          the CI configuration. The operator configures ingress for the tenant route and
          monitoring access to the dedicated metrics port.
          EOF

          echo "CI setup complete: template populated with ${APP_NAME} values"

      - task: lint:values-generate
        with:
          flavor: upstream

  - name: ci-check-package
    description: Inspect the Podinfo archive produced by the template
    actions:
      - cmd: |
          set -eu
          archive="zarf-package-podinfo-${UDS_ARCH}-0.0.0-dev-upstream.tar.zst"
          inspection=$(mktemp -d)
          trap 'rm -rf "$inspection"' EXIT

          ./zarf dev lint --flavor upstream .
          ./zarf package inspect manifests "$archive" > "$inspection/manifests.yaml"
          ./zarf package inspect images "$archive" > "$inspection/images.yaml"
          ./zarf package inspect documentation "$archive" --output "$inspection"

          ./zarf tools yq -e 'any_c(. == "ghcr.io/stefanprodan/podinfo:6.7.1")' "$inspection/images.yaml"
          ./zarf tools yq -e 'select((.kind == "Package") and (.metadata.name == "podinfo"))' \
            "$inspection/manifests.yaml" > "$inspection/package.yaml"
          ./zarf tools yq -e '
            [
              (.spec.network.serviceMesh.mode == "ambient"),
              (.spec.network.expose[0].selector."app.kubernetes.io/name" == "podinfo"),
              ((.spec.network.allow | length) == 0),
              (.spec.sso[0].enableAuthserviceSelector."app.kubernetes.io/name" == "podinfo"),
              (.spec.monitor[0].targetPort == 9797),
              (.spec.monitor[0].portName == "http-metrics")
            ] | all_c(. == true)
          ' "$inspection/package.yaml"
          ./zarf tools yq -e 'select((.kind == "Deployment") and (.metadata.name == "podinfo"))' \
            "$inspection/manifests.yaml" > "$inspection/deployment.yaml"
          ./zarf tools yq -e '
            .spec.template.spec.containers[0] |
            [
              (.image == "ghcr.io/stefanprodan/podinfo:6.7.1"),
              (.securityContext.runAsNonRoot == true),
              (.securityContext.allowPrivilegeEscalation == false),
              (.ports | any_c((.name == "http-metrics") and (.containerPort == 9797)))
            ] | all_c(. == true)
          ' "$inspection/deployment.yaml"
          cmp docs/configuration.md "$inspection/podinfo-documentation/configuration.md"
          cmp docs/justifications.md "$inspection/podinfo-documentation/justifications.md"

#### Template CI: Remove this block and both CI task calls when building a package ####

# CI will execute the following (via uds-common/.github/workflows/callable-test.yaml) so they need to be here with these names
  - name: test-install
    description: Test deploying the current branch to a new cluster
    actions:
      - task: ci-setup # remove this when building a package
      - task: create-dev-package
      - task: ci-check-package # remove this when building a package
      - task: setup:k3d-test-cluster
      - task: create-deploy-test-bundle

  - name: test-upgrade
    description: Test an upgrade from the latest released package to the current branch
    actions:
      - task: upgrade:create-latest-tag-bundle
      - task: setup:k3d-test-cluster
      - task: deploy:test-bundle
      - task: create-dev-package
      - task: create-deploy-test-bundle

  - name: publish-package
    description: Build and publish the packages
    actions:
      - description: Create the package
        task: create:package

      - description: Setup the cluster
        task: setup:k3d-test-cluster

      - description: Create deploy and test the bundle
        task: create-deploy-test-bundle

      - description: Publish the packages
        task: publish:package
