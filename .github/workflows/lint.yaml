name: Lint

on:
  # This workflow is triggered on pull requests to the main branch.
  pull_request:
    branches: [main]
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, edited, synchronize]

jobs:
  validate:
    uses: du-jonathanagustin/uds-common/.github/workflows/callable-lint.yaml@997fde54fd7f817761c73f6668b548faffc73fe0 # Zarf v1 workflow branch
    with:
      # Schema freshness requires a populated package and generated schema.
      values-check: false
    secrets: inherit
